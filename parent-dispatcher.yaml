steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Directing build request to Trigger: ${_TARGET_TRIGGER}"
        # Added --region flag to ensure the trigger is found
        gcloud builds triggers run ${_TARGET_TRIGGER} \
          --region=${_REGION} \
          --branch=${_TARGET_BRANCH} \
          --substitutions=_IMAGE_NAME=${_IMAGE_NAME},_DOCKERFILE_PATH=${_DOCKERFILE_PATH},_SERVICE_NAME=${_SERVICE_NAME}

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: 'global' # Change this to 'us-central1' if your triggers are regional
