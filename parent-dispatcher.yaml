steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Starting Trigger: ${_TRIGGER_NAME}"
        
        gcloud builds triggers run "${_TRIGGER_NAME}" \
          --region="us-central1" \
          --branch="local-test"

substitutions:
  _TRIGGER_NAME: "enter-name-here" # This is your ONLY input in the console

options:
  logging: CLOUD_LOGGING_ONLY
