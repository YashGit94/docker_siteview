steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Searching for trigger: ${_TRIGGER_NAME}"
        
        # Check if it exists and list available triggers if it doesn't
        if ! gcloud builds triggers describe "${_TRIGGER_NAME}" --region="us-central1" > /dev/null 2>&1; then
          echo "ERROR: Trigger NOT FOUND. Available triggers in this region are:"
          gcloud builds triggers list --region="us-central1" --format="value(name)"
          exit 1
        fi

        gcloud builds triggers run "${_TRIGGER_NAME}" \
          --region="us-central1" \
          --branch="main"

substitutions:
  _TRIGGER_NAME: "your-exact-trigger-name"

options:
  logging: CLOUD_LOGGING_ONLY
