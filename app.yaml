# # Use a custom runtime to trigger the build from your Dockerfile
# runtime: custom
# env: flex

# # App Engine Flexible requires at least one instance
# manual_scaling:
#   instances: 1

# resources:
#   cpu: 1
#   memory_gb: 1.5
#   disk_size_gb: 10

# # Ensure the network routes traffic to the port exposed in your Dockerfile
# network:
#   forwarded_ports:
#     - 80

runtime: custom
env: flex

# Basic scaling for a single instance
manual_scaling:
  instances: 1

resources:
  cpu: 1
  memory_gb: 1.5
  disk_size_gb: 10

# Forwarding to the non-reserved port
network:
  forwarded_ports:
    - 8081

# Ensuring the health check hits the correct port
liveness_check:
  path: "/index.html"
  check_interval_sec: 30
  timeout_sec: 4

readiness_check:
  path: "/index.html"
  check_interval_sec: 5
  timeout_sec: 4
