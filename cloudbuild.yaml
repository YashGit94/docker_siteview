steps:
  # Build the Docker image using variables from the Trigger UI
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:${_TAG}'
      - '--build-arg'
      - 'BUILD_CONFIG=${_BUILD_CONFIG}'
      - '.'

  # Push the image to the registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:${_TAG}'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# Default values if not provided in the Trigger UI
substitutions:
  _BUILD_CONFIG: production
  _IMAGE_NAME: sitenov-app
  _SERVICE_NAME: sitenov-service
  _REGION: us-central1
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
