# # This section fixes the "invalid argument" error regarding service accounts and logging
# options:
#   logging: CLOUD_LOGGING_ONLY

# images:
#   - 'gcr.io/$PROJECT_ID/$REPO_NAME-$BRANCH_NAME:$COMMIT_SHA'

steps:
  # 1. Build and Push (Sanitized)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _CLEAN_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
        _CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | tr '_/' '-' | sed 's/-$//')
        _IMAGE="gcr.io/$PROJECT_ID/$$_CLEAN_REPO-$$_CLEAN_BRANCH:$COMMIT_SHA"
        docker build -t "$$_IMAGE" .
        docker push "$$_IMAGE"

  # 2. Deploy with Explicit Port 80
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _CLEAN_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
        _CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | tr '_/' '-' | sed 's/-$//')
        _SERVICE="$$_CLEAN_REPO-$$_CLEAN_BRANCH"
        
        gcloud run deploy "$$_SERVICE" \
          --image "gcr.io/$PROJECT_ID/$$_SERVICE:$COMMIT_SHA" \
          --region us-central1 \
          --platform managed \
          --port 80 \
          --no-allow-unauthenticated

# options:
#   logging: CLOUD_LOGGING_ONLY

options:
  # This cuts Angular build time significantly
  machineType: 'E2_HIGHCPU_32'
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'
