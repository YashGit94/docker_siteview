steps:
  # 1. Sanitize Repo and Branch names for Cloud Run compatibility
  # Replaces underscores and slashes with dashes and converts to lowercase
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _CLEAN_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
        _CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | tr '_/' '-' | sed 's/-$//')
        echo "$${_CLEAN_REPO}-$${_CLEAN_BRANCH}" > /workspace/_service_name.txt

  # 2. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        _IMAGE_NAME="gcr.io/$PROJECT_ID/$$_SERVICE_NAME:$COMMIT_SHA"
        docker build -t "$$_IMAGE_NAME" .

  # 3. Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        _IMAGE_NAME="gcr.io/$PROJECT_ID/$$_SERVICE_NAME:$COMMIT_SHA"
        docker push "$$_IMAGE_NAME"

  # 4. Deploy to Cloud Run
  # Explicitly sets port 80 to match Nginx default
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        gcloud run deploy "$$_SERVICE_NAME" \
          --image "gcr.io/$PROJECT_ID/$$_SERVICE_NAME:$COMMIT_SHA" \
          --region us-central1 \
          --platform managed \
          --port 80 \
          --no-allow-unauthenticated

  # 5. Optional: Set IAM policy to allow public access
  # This is separated to prevent build failure if the service account lacks IAM permissions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        gcloud run services add-iam-policy-binding "$$_SERVICE_NAME" \
          --region=us-central1 \
          --member="allUsers" \
          --role="roles/run.invoker" || echo "Manual IAM update required for public access"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  # Using a placeholder that the UI will recognize; actual images are pushed in Step 3
  - 'gcr.io/$PROJECT_ID/siteview-dynamic-image'
