# options:
#   logging: CLOUD_LOGGING_ONLY

# images:
#   - 'gcr.io/$PROJECT_ID/$REPO_NAME-$BRANCH_NAME:$COMMIT_SHA'



steps:
  # 1. Sanitize the branch name and export to a file
  - name: 'bash'
    args:
      - '-c'
      - |
        # Replace underscores and slashes with dashes, convert to lowercase
        CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | tr '_/' '-' | sed 's/--/-/g')
        echo "$CLEAN_BRANCH" > /workspace/branch_name.txt

  # 2. Build and Push using a single shell context to avoid variable loss
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _BRANCH=$(cat /workspace/branch_name.txt)
        # Ensure the name doesn't end in a dash by removing trailing hyphens
        _SAFE_NAME=$(echo "siteview-$_BRANCH" | sed 's/-$//')
        
        docker build -t "gcr.io/$PROJECT_ID/$_SAFE_NAME:$COMMIT_SHA" .
        docker push "gcr.io/$PROJECT_ID/$_SAFE_NAME:$COMMIT_SHA"

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _BRANCH=$(cat /workspace/branch_name.txt)
        _SAFE_NAME=$(echo "siteview-$_BRANCH" | sed 's/-$//')
        
        gcloud run deploy "$_SAFE_NAME" \
          --image "gcr.io/$PROJECT_ID/$_SAFE_NAME:$COMMIT_SHA" \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY
