steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sitenov-app:$COMMIT_SHA', '.']

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sitenov-app:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run (Optional - uncomment to enable)
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   entrypoint: gcloud
  #   args:
  #   - 'run'
  #   - 'deploy'
  #   - 'sitenov-service'
  #   - '--image'
  #   - 'gcr.io/$PROJECT_ID/sitenov-app:$COMMIT_SHA'
  #   - '--region'
  #   - 'us-central1'
  #   - '--platform'
  #   - 'managed'
  #   - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/sitenov-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
