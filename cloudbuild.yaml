steps:
  # 1. Sanitize Repo and Branch names for Cloud Run naming compliance
  # Replaces underscores/slashes with dashes and converts to lowercase
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _CLEAN_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
        _CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | tr '_/' '-' | sed 's/-$//')
        echo "$${_CLEAN_REPO}-$${_CLEAN_BRANCH}" > /workspace/_service_name.txt

  # 2. Build the container image
  # Uses the sanitized name to ensure the image tag is valid
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        _IMAGE_NAME="gcr.io/$PROJECT_ID/$$_SERVICE_NAME:$COMMIT_SHA"
        docker build -t "$$_IMAGE_NAME" .

  # 3. Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        _IMAGE_NAME="gcr.io/$PROJECT_ID/$$_SERVICE_NAME:$COMMIT_SHA"
        docker push "$$_IMAGE_NAME"

  # 4. Deploy to Cloud Run
  # --port 80 is specified to match the Nginx default listen port
  # --no-allow-unauthenticated is used to prevent build crashes due to Org Policies
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        gcloud run deploy "$$_SERVICE_NAME" \
          --image "gcr.io/$PROJECT_ID/$$_SERVICE_NAME:$COMMIT_SHA" \
          --region us-central1 \
          --platform managed \
          --port 80 \
          --no-allow-unauthenticated

  # 5. Optional IAM Binding
  # This step attempts to make the service public but will not fail the build if blocked by an Org Policy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        gcloud run services add-iam-policy-binding "$$_SERVICE_NAME" \
          --region=us-central1 \
          --member="allUsers" \
          --role="roles/run.invoker" || echo "Public access blocked by Organization Policy. Please update manually in Console."

options:
  logging: CLOUD_LOGGING_ONLY

# Note: The images: block is omitted to avoid 'failed to find images' errors 
# caused by the dynamic naming used in the bash steps.
