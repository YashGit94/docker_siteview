steps:
  # 1. Sanitize Repo and Branch names
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _CLEAN_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
        _CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | tr '_/' '-' | sed 's/-$//')
        echo "$${_CLEAN_REPO}-$${_CLEAN_BRANCH}" > /workspace/_service_name.txt

  # 2. Build and Push (Sanitized)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        _IMAGE_NAME="gcr.io/$PROJECT_ID/$$_SERVICE_NAME:$COMMIT_SHA"
        docker build -t "$$_IMAGE_NAME" .
        docker push "$$_IMAGE_NAME"

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        gcloud run deploy "$$_SERVICE_NAME" \
          --image "gcr.io/$PROJECT_ID/$$_SERVICE_NAME:$COMMIT_SHA" \
          --region us-central1 \
          --platform managed \
          --port 80 \
          --no-allow-unauthenticated

  # 4. Attempt IAM binding but do not fail the build if Org Policy blocks it
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SERVICE_NAME=$(cat /workspace/_service_name.txt)
        gcloud run services add-iam-policy-binding "$$_SERVICE_NAME" \
          --region=us-central1 \
          --member="allUsers" \
          --role="roles/run.invoker" || echo "Public access blocked by Organization Policy."

options:
  logging: CLOUD_LOGGING_ONLY

# REMOVED the images: block because we are pushing images manually in step 2.
# This prevents the 'failed to find images' error.
